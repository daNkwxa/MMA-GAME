name: Build Android (APK)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java kur (Gradle için gerekli)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: NPM bağımlılıklarını kur
        run: npm install

      - name: Web dosyalarını build et
        run: node build.js

      - name: Capacitor CLI global kur
        run: npm install -g @capacitor/cli

      - name: Android platformunu ekle (yoksa)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Debug keystore ile imzalı APK oluştur
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: APK'yı Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: MMA-GOAT-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
