name: Build iOS (Unsigned IPA)

on:
  workflow_dispatch:   # Actions sekmesinden elle "Run workflow" ile tetiklenir
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14   # Ücretsiz macOS runner (Apple Silicon)

    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM bağımlılıklarını kur
        run: npm install

      - name: Web dosyalarını build et + Capacitor sync
        run: npm run build:ios

      - name: CocoaPods kur
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Xcode Archive oluştur (imzasız)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Payload klasörü oluştur ve IPA paketle
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd $RUNNER_TEMP
          zip -r App-unsigned.ipa Payload
          mkdir -p ${{ github.workspace }}/output
          cp App-unsigned.ipa ${{ github.workspace }}/output/

      - name: IPA'yı Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: MMA-GOAT-unsigned-ipa
          path: output/App-unsigned.ipa
          retention-days: 14
